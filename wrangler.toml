name = "pc-board-repair"
main = "src/seo-entry.js"
compatibility_date = "2026-10-02"

[vars]
GOOGLE_CLIENT_ID = "688045496018-0l0ok4kt8nv7rp2c294ktep51rt3s0bp.apps.googleusercontent.com"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = [ "/api/*", "/data/boards.json", "/download/*", "/downloads/*", "/", "/*.html", "/boardview/*", "/bios/*", "/diagnostics/*", "/component-testing/*", "/sitemap.xml" ]

[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

[exports.ChatRoom]
type = "durable-object"
storage = "sqlite"
