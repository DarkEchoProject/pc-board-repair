<svg xmlns="http://www.w3.org/2000/svg" width="520" height="280" viewBox="0 0 520 280" role="img" aria-labelledby="title description">
  <title id="title">One-time boot menu example</title>
  <desc id="description">Windows Boot Manager is the selected entry for the internal SSD. An external USB drive is a separate entry.</desc>
  <rect width="520" height="280" fill="#081729"/>
  <path d="M0 0h520v56H0z" fill="#122b43"/>
  <circle cx="28" cy="28" r="6" fill="#7ce9f9"/>
  <text x="46" y="35" fill="#bfeafb" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">ONE-TIME BOOT MENU</text>
  <rect x="24" y="79" width="472" height="100" rx="12" fill="#15384b" stroke="#7ce9f9" stroke-width="2"/>
  <path d="m43 118 10 10-10 10" fill="none" stroke="#7ce9f9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="70" y="123" fill="#f0f6ff" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">Windows Boot Manager</text>
  <text x="70" y="152" fill="#b8d3e9" font-family="Segoe UI, Arial, sans-serif" font-size="21">Internal SSD</text>
  <rect x="24" y="192" width="472" height="63" rx="12" fill="#10243a" stroke="#355570"/>
  <text x="42" y="231" fill="#d7e7f7" font-family="Segoe UI, Arial, sans-serif" font-size="22">UEFI USB Drive</text>
</svg>
