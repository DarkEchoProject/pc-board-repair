<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BoardView | PC Board Repair</title>
<meta name="description" content="ملفات BoardView مرتبة حسب الشركة والموديل ورقم البورد في PC Board Repair.">
<meta name="robots" content="index,follow">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<header><a class="logo" href="../index.html">⚙️ PC Board Repair</a><nav><a href="../index.html">الرئيسية</a><a href="index.html">BoardView</a><a href="../bios/index.html">BIOS</a><a href="../about.html">من نحن</a><a href="../contact.html">اتصل بنا</a></nav></header>
<main class="wrap">
  <div class="crumb"><a href="index.html">BoardView</a> ← <span id="crumbBrand"></span></div>
  <h1 id="title">BoardView</h1>
  <p class="muted" id="intro">اختر الملف المطابق للموديل ورقم اللوحة وRevision.</p>
  <input id="search" class="searchBox" type="search" aria-label="البحث داخل الشركة" placeholder="ابحث داخل هذه الشركة">
  <div id="list"></div>
</main>
<footer><div class="footerLinks"><a href="../about.html">من نحن</a><a href="../contact.html">اتصل بنا</a><a href="../privacy.html">سياسة الخصوصية</a><a href="../terms.html">شروط الاستخدام</a><a href="../disclaimer.html">إخلاء المسؤولية</a><a href="../copyright.html">حقوق النشر</a></div><div>© 2026 PC Board Repair</div></footer>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const brand=new URLSearchParams(location.search).get('brand')||''; let items=[];
document.getElementById('crumbBrand').textContent=brand;
document.getElementById('title').textContent=brand?brand+' BoardView':'BoardView';
document.title=(brand?brand+' BoardView':'BoardView')+' | PC Board Repair';
if(brand){
  const d=document.querySelector('meta[name="description"]');
  d.content='تحميل خرائط وملفات BoardView لأجهزة ولوحات '+brand+' مرتبة حسب الموديل ورقم البورد.';
  const canonical=document.createElement('link'); canonical.rel='canonical'; canonical.href='https://pc-board-repair.alinasser00001.workers.dev/boardview/company.html?brand='+encodeURIComponent(brand); document.head.appendChild(canonical);
}
function normalize(all){
  return (Array.isArray(all)?all:[])
    .flatMap(x=>Array.isArray(x?.value)?x.value:[x])
    .filter(x=>x && typeof x.brand==='string' && x.brand.trim());
}
function card(b){
 const meta=[b.type,b.board,b.revision,b.platform,b.note].filter(Boolean).map(esc).join(' • ');
 const image=b.image?`<a class="boardImageLink" href="../images/${encodeURIComponent(b.image)}" target="_blank" rel="noopener"><img class="boardImage" loading="lazy" src="../images/${encodeURIComponent(b.image)}" alt="${esc('لوحة '+b.brand+' '+b.model)}"></a>`:`<div class="boardPlaceholder">🧩<span>لا توجد صورة بعد</span></div>`;
 return `<article class="boardCard">${image}<div class="boardInfo"><h2>${esc(b.model)}</h2><p class="fileMeta">${meta}</p><p><a class="btn" href="../downloads/${encodeURIComponent(b.file)}" download>⬇️ تحميل الملف</a></p>${b.image?`<p><a class="imageBtn" href="../images/${encodeURIComponent(b.image)}" target="_blank" rel="noopener">🖼️ فتح صورة اللوحة</a></p>`:''}</div></article>`;
}
function render(list){document.getElementById('list').innerHTML=list.length?list.map(card).join(''):'<div class="emptyState">لا توجد ملفات لهذه الشركة.</div>';}
fetch('../data/boards.json',{cache:'no-store'})
  .then(r=>r.json())
  .then(all=>{const clean=normalize(all);items=clean.filter(b=>b.brand.toLowerCase()===brand.toLowerCase());document.getElementById('intro').textContent=brand?`يوجد ${items.length} ملفًا ضمن ${brand}. ابحث بالموديل أو رقم البورد ثم تحقق من Revision قبل التحميل.`:'اختر شركة من صفحة BoardView.';render(items);})
  .catch(()=>{document.getElementById('list').innerHTML='<div class="emptyState">تعذر تحميل ملفات هذه الشركة.</div>';});
document.getElementById('search').addEventListener('input',e=>{const t=e.target.value.toLowerCase().trim();render(!t?items:items.filter(b=>Object.values(b).join(' ').toLowerCase().includes(t)));});
</script></body></html>
