<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BoardView | PC Board Repair</title><link rel="stylesheet" href="../style.css"></head>
<body>
<header><div class="logo">⚙️ PC Board Repair</div><nav><a href="../index.html">الرئيسية</a><a href="index.html">BoardView</a><a href="../bios/index.html">BIOS</a></nav></header>
<main class="wrap">
  <div class="crumb"><a href="index.html">BoardView</a> ← <span id="crumbBrand"></span></div>
  <h1 id="title">BoardView</h1>
  <input id="search" class="searchBox" type="search" placeholder="ابحث داخل هذه الشركة">
  <div id="list"></div>
</main><footer>PC Board Repair — V7</footer>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const brand=new URLSearchParams(location.search).get('brand')||''; let items=[];
document.getElementById('crumbBrand').textContent=brand; document.getElementById('title').textContent=brand+' BoardView'; document.title=brand+' BoardView | PC Board Repair';
function card(b){
 const meta=[b.type,b.board,b.revision,b.platform,b.note].filter(Boolean).map(esc).join(' • ');
 const image=b.image?`<a class="boardImageLink" href="../images/${encodeURIComponent(b.image)}" target="_blank"><img class="boardImage" src="../images/${encodeURIComponent(b.image)}" alt="${esc(b.brand+' '+b.model)}"></a>`:`<div class="boardPlaceholder">🧩<span>لا توجد صورة بعد</span></div>`;
 return `<article class="boardCard">${image}<div class="boardInfo"><h2>${esc(b.model)}</h2><p class="fileMeta">${meta}</p><p><a class="btn" href="../downloads/${encodeURIComponent(b.file)}" download>⬇️ تحميل الملف</a></p>${b.image?`<p><a class="imageBtn" href="../images/${encodeURIComponent(b.image)}" target="_blank">🖼️ فتح صورة اللوحة</a></p>`:''}</div></article>`;
}
function render(list){document.getElementById('list').innerHTML=list.length?list.map(card).join(''):'<div class="emptyState">لا توجد ملفات لهذه الشركة.</div>';}
fetch('../data/boards.json',{cache:'no-store'}).then(r=>r.json()).then(all=>{items=all.filter(b=>b.brand.toLowerCase()===brand.toLowerCase());render(items);});
document.getElementById('search').addEventListener('input',e=>{const t=e.target.value.toLowerCase().trim();render(!t?items:items.filter(b=>Object.values(b).join(' ').toLowerCase().includes(t)));});
</script></body></html>
